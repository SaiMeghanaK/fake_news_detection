{% extends "base.html" %}
{% block title %}Register - TruthLens{% endblock %}
{% block content %}
<div class="container">
    <div class="row justify-content-center mt-5 mb-5">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h2 class="text-center mb-4">
                        Create Account
                    </h2>
                    <p class="text-center text-muted">
                        Join our platform
                    </p>
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">
                                Email
                            </label>
                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                placeholder="Enter your email"
                                required
                            >
                        </div>
                        <div class="mb-3">
                            <label class="form-label">
                                Phone
                            </label>
                            <input
                                type="text"
                                name="phone"
                                class="form-control"
                                placeholder="Enter phone number"
                            >
                        </div>
                        <div class="mb-3">
                            <label class="form-label">
                                Account Type
                            </label>
                            <select
                                name="role"
                                class="form-select"
                                required
                            >
                                <option value="">
                                    Select account type
                                </option>
                                <option value="reader">
                                    Reader
                                </option>
                                <option value="writer">
                                    Writer
                                </option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">
                                Password
                            </label>
                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                required
                            >
                        </div>
                        <div class="mb-4">
                            <label class="form-label">
                                Confirm Password
                            </label>
                            <input
                                type="password"
                                name="confirm_password"
                                class="form-control"
                                required
                            >
                        </div>
                        <button
                            type="submit"
                            class="btn btn-dark w-100"
                        >
                            Create Account
                        </button>
                    </form>
                    <div class="text-center mt-3">
                        Already have an account?
                        <a href="/login/">
                            Login
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
